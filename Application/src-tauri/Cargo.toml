[package]
name = "ir-remote"
version = "0.1.0"
description = "Desktop control panel for the ESP32 IR blaster"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ir_remote_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# All four are named in Instruction.md section 11 as expected dependencies.
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "net", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
