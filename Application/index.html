<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) to be non-zero.
         MainActivity calls enableEdgeToEdge(), so without it the banner renders
         underneath the status bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>IR Remote</title>
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <main>
      <!-- 1. Connection banner: connected or not, nothing else -->
      <section id="banner" class="banner tone-idle">
        <div class="banner-row">
          <span id="banner-dot" class="dot"></span>
          <h1 id="banner-label">Connecting</h1>
          <button id="settings-toggle" class="icon-button" aria-expanded="false"
                  aria-controls="settings-panel" title="Settings">⚙</button>
        </div>
        <!-- Empty in normal operation. Only a fatal boot failure writes here,
             because a blank window is indistinguishable from a quiet device. -->
        <p id="banner-detail" class="detail"></p>
      </section>

      <!-- 2. Current device state, with its age -->
      <section class="card">
        <h2>Last confirmed action</h2>
        <p id="device-label" class="device-label">No command sent yet</p>
        <p id="device-age" class="age"></p>
        <p id="device-caveat" class="caveat"></p>
      </section>

      <!-- 3. Controls -->
      <section class="card">
        <h2>Controls</h2>
        <div id="controls" class="controls"></div>
        <p class="caveat">
          Each button fires one IR code. Nothing is retried automatically — a retry
          would toggle the unit twice.
        </p>
      </section>

      <!-- 4. Alarms -->
      <section class="card">
        <h2>Alarms <span class="muted">daily</span></h2>

        <form id="alarm-form" class="alarm-form">
          <label>Time<input id="alarm-time" type="time" required value="07:00" /></label>
          <label>
            Sends
            <select id="alarm-command">
              <option value="Power">Power (toggle)</option>
              <option value="Silent">Silent</option>
              <option value="LowTemp">Temp −</option>
              <option value="HighTemp">Temp +</option>
            </select>
          </label>
          <button type="submit">Add alarm</button>
        </form>

        <div id="alarms" class="alarms"></div>
        <p id="alarm-error" class="caveat warn"></p>
        <p id="exact-warning" class="caveat warn" hidden>
          <span id="exact-warning-text"></span>
          <button type="button" id="exact-grant" class="inline-button">Allow exact alarms</button>
        </p>
        <p id="alarm-caveat" class="caveat warn"></p>
      </section>

      <!-- 5. Settings, hidden behind the gear in the banner -->
      <section id="settings-panel" class="card" hidden>
        <h2>Settings</h2>

        <p class="setting-row">
          <span class="setting-key">Device</span>
          <span id="base-url-value" class="setting-value">—</span>
        </p>

        <form id="device-form" class="settings" hidden>
          <label>Device address<input id="base-url-input" type="url" inputmode="url"
                 spellcheck="false" autocomplete="off" placeholder="http://192.168.0.102" /></label>
          <button type="submit">Save address</button>
        </form>

        <p class="caveat" id="base-url-note"></p>

        <form id="settings" class="settings">
          <label>Poll interval (ms)<input id="poll-interval" type="number" min="100" step="100" /></label>
          <label>Command timeout (ms)<input id="command-timeout" type="number" min="100" step="100" /></label>
          <label>Probe timeout (ms)<input id="probe-timeout" type="number" min="100" step="100" /></label>
          <label>Stale after (ms)<input id="stale-after" type="number" min="500" step="100" /></label>
          <button type="submit">Apply</button>
        </form>

        <form id="creds" class="settings">
          <label>Username<input id="cred-user" type="text" spellcheck="false" autocomplete="off" /></label>
          <label>Password<input id="cred-pass" type="password" autocomplete="off" /></label>
          <button type="submit">Save to OS keychain</button>
          <button type="button" id="cred-clear">Clear</button>
        </form>
        <p class="caveat" id="cred-note"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
